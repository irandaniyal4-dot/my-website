name: Build Rasano APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RASANO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/rasano-release.jks

      - name: Verify Keystore
        env:
          RASANO_KEYSTORE_PASSWORD: ${{ secrets.RASANO_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore app/rasano-release.jks \
            -storetype JKS \
            -storepass "$RASANO_KEYSTORE_PASSWORD"

      - name: Build Release APK
        env:
          RASANO_KEYSTORE_PASSWORD: ${{ secrets.RASANO_KEYSTORE_PASSWORD }}
          RASANO_KEY_PASSWORD: ${{ secrets.RASANO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rasano-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
