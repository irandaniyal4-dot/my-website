name: Build Rasano APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Keystore
        env:
          RASANO_KEYSTORE_PASSWORD: ${{ secrets.RASANO_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore app/rasano-release.jks \
            -alias rasano -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$RASANO_KEYSTORE_PASSWORD" -keypass "$RASANO_KEYSTORE_PASSWORD" \
            -dname "CN=Rasano, OU=Rasano, O=Rasano, L=Ardabil, ST=Ardabil, C=IR"

      - name: Verify Keystore
        env:
          RASANO_KEYSTORE_PASSWORD: ${{ secrets.RASANO_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore app/rasano-release.jks \
            -storetype JKS \
            -storepass "$RASANO_KEYSTORE_PASSWORD"

      - name: Build Release APK
        env:
          RASANO_KEYSTORE_PASSWORD: ${{ secrets.RASANO_KEYSTORE_PASSWORD }}
          RASANO_KEY_PASSWORD: ${{ secrets.RASANO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rasano-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
